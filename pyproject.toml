[project]
name = "yt-dlp-tui"
version = "0.1.0"
description = "A terminal UI for yt-dlp."
readme = "README.md"
authors = [
    { name = "Kounat", email = "21286794+kounat@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
yt-dlp-tui = "yt_dlp_tui:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
